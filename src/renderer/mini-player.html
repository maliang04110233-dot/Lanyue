<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http: https:; media-src 'self' data: blob: http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws:;">
  <title>迷你播放器</title>
  <!-- CSP 说明（2026-09-28 复审收紧）：media-src 原先比其他两个页面多一个
       `file:`，但本窗口**不含任何 <audio>/<video> 元素**（播放由主窗口负责，
       这里只接收 mini-player-update 推送的标题/封面/进度），且封面走
       img-src（网络歌 http(s)、本地歌 base64 → data:）。`file:` 从未被用到，
       属于无谓的攻击面放宽，故移除。若将来这里要直放本地音频，请连同理由一起加回。 -->
  <!-- 复用主窗口的令牌与事件
       ⚠️ 本文件不再放行 base.css 里的 html,body 规则：body 里显式覆盖 -->
  <link rel="stylesheet" href="./styles/base.css">
  <style>
    body {
      width: 360px; height: 80px;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: 0 var(--sp-3);
      background: var(--bg-card);
      border: 1px solid var(--stroke-1);
      -webkit-app-region: drag;
      user-select: none;
    }

    /* ── 封面（圆角方形，与主面板一致）───────────────── */
    .mp-cover, .mp-cover-ph {
      width: 48px; height: 48px;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .mp-cover { object-fit: cover; background: var(--elev-2); display: block; }
    /* 方形封面不做 360° 旋转，改为缓慢轻摆（与主面板 animation-rotate 同语义） */
    .mp-cover.playing { animation: mp-sway 9s var(--ease) infinite; }
    @keyframes mp-sway {
      0%, 100% { transform: perspective(700px) rotateY(0deg); }
      50%      { transform: perspective(700px) rotateY(-7deg); }
    }
    .mp-cover-ph {
      display: flex; align-items: center; justify-content: center;
      background: var(--elev-2);
      color: var(--fg-3);
    }

    /* ── 信息 ─────────────────────────────────────────── */
    .mp-info {
      flex: 1;
      min-width: 0;
      max-width: 150px;
      -webkit-app-region: no-drag;
    }
    .mp-title {
      font-size: var(--fs-md);
      font-weight: var(--fw-med);
      color: var(--fg-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-title.marquee {
      text-overflow: clip;
      --marquee-shift: -80px;
      animation: mp-marquee 10s linear infinite;
    }
    .mp-title.marquee:hover { animation-play-state: paused; }
    @keyframes mp-marquee {
      0%, 10% { transform: translateX(0); }
      90%, 100% { transform: translateX(var(--marquee-shift)); }
    }
    .mp-artist {
      margin-top: 1px;
      font-size: var(--fs-xs);
      color: var(--fg-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-lyric {
      margin-top: 1px;
      font-size: var(--fs-xs);
      color: var(--accent-ui);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── 控制 ─────────────────────────────────────────── */
    .mp-controls {
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .mp-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--r-sm);
      color: var(--fg-2);
      cursor: pointer;
      transition: color var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
    }
    .mp-btn:hover { color: var(--fg-1); background: var(--elev-1); }
    .mp-btn.mp-play { color: var(--accent-ui); }
    .mp-btn.mp-play:hover { background: var(--accent-soft); }

    .mp-time {
      flex-shrink: 0;
      font-size: var(--fs-xs);
      color: var(--fg-3);
      font-variant-numeric: tabular-nums;
      -webkit-app-region: no-drag;
    }
    .mp-quality {
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 999px;
      color: var(--accent-ui);
      background: var(--accent-soft);
      -webkit-app-region: no-drag;
    }
    .mp-close {
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--r-xs);
      color: var(--fg-3);
      cursor: pointer;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      transition: color var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
    }
    .mp-close:hover { color: var(--c-danger); background: var(--elev-1); }

    /* ── 底部进度 ─────────────────────────────────────── */
    .mp-progress {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: var(--elev-2);
    }
    .mp-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-ui);
      transition: width var(--dur-3) linear;
    }
  </style>
</head>
<body>
  <img class="mp-cover" id="miniCover" style="display:none" src="" alt="专辑封面">
  <div class="mp-cover-ph" id="miniCoverPh">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19a3 3 0 1 1-2-2.83V7l10-2v7.17A3 3 0 1 0 19 15V3L7 5v12.17Z"/></svg>
  </div>
  <div class="mp-info">
    <div class="mp-title" id="miniTitle" data-i18n="player.playing">未在播放</div>
    <div class="mp-artist" id="miniArtist" data-i18n="player.artist">—</div>
    <div class="mp-lyric" id="miniLyric"></div>
  </div>
  <div class="mp-controls">
    <button class="mp-btn" onclick="send('mini-prev')" title="上一首" aria-label="上一首">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="mp-btn mp-play" id="miniPlayBtn" onclick="send('mini-toggle-play')" title="播放/暂停" aria-label="播放或暂停">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="mp-btn" onclick="send('mini-next')" title="下一首" aria-label="下一首">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>
  <span class="mp-quality" id="miniQuality" style="display:none" title="本次播放音质"></span>
  <span class="mp-time" id="miniTime">0:00 / 0:00</span>
  <button class="mp-close" onclick="send('mini-close')" title="关闭" aria-label="关闭迷你播放器">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="mp-progress">
    <div class="mp-progress-fill" id="miniProgressFill"></div>
  </div>

  <script>
    function send(channel) { window.miniAPI.send(channel); }

    const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

    window.miniAPI.on('mini-player-update', (data) => {
      const title = document.getElementById('miniTitle');
      const artist = document.getElementById('miniArtist');
      const cover = document.getElementById('miniCover');
      const coverPh = document.getElementById('miniCoverPh');
      const playBtn = document.getElementById('miniPlayBtn');
      const progress = document.getElementById('miniProgressFill');
      const lyric = document.getElementById('miniLyric');
      const timeEl = document.getElementById('miniTime');
      const qualityEl = document.getElementById('miniQuality');
      const QLAB = { standard: '128k', hq: '320k', lossless: '无损' };

      if (data.title) {
        title.textContent = data.title;
        // 溢出则跑马灯：移除动画类后实测，再写滚动距离
        title.classList.remove('marquee');
        const overflow = title.scrollWidth - title.parentElement.clientWidth;
        if (overflow > 2) {
          title.style.setProperty('--marquee-shift', '-' + (overflow + 12) + 'px');
          title.classList.add('marquee');
        }
      }
      if (data.artist !== undefined) artist.textContent = data.artist || '未知艺术家';
      // M13: 元信息（title/artist/cover）只在换曲时推送，进度帧不带——
      // 未提供时保持上一次渲染，不能用 falsy 分支误清封面
      if (data.cover !== undefined) {
        if (data.cover) {
          cover.src = data.cover;
          cover.style.display = 'block';
          coverPh.style.display = 'none';
        } else {
          cover.style.display = 'none';
          coverPh.style.display = 'flex';
          cover.classList.remove('playing');
        }
      }
      if (data.playing !== undefined) {
        cover.classList.toggle('playing', !!data.playing);
        playBtn.innerHTML = data.playing ? ICON_PAUSE : ICON_PLAY;
        playBtn.title = data.playing ? '暂停' : '播放';
      }
      if (typeof data.progress === 'number') {
        progress.style.width = data.progress + '%';
      }
      if (data.lyric) {
        lyric.textContent = data.lyric;
        lyric.style.display = 'block';
      } else {
        lyric.style.display = 'none';
      }
      if (data.time) {
        timeEl.textContent = data.time;
      }
      // M13 同款约定：quality 只在换曲时推送，未提供时保持上一次显示
      if (data.quality !== undefined) {
        const ql = QLAB[data.quality] || '';
        if (ql) { qualityEl.textContent = ql; qualityEl.style.display = 'inline-block'; }
        else qualityEl.style.display = 'none';
      }
    });
  </script>
</body>
</html>
