# CI —— 提交与 PR 的质量闸门
#
# 分层设计（快 → 慢），越靠前的失败越早反馈：
#   jobs.lint-test  : 纯源码检查，秒级，主战场
#   jobs.build-smoke: 真实构建 + asar 解包校验，分钟级
#
# 为什么不把 build-smoke 合进 lint-test：
#   electron-builder 的打包在 CI 上要几分钟（下载 Electron 二进制 + 压缩），
#   而 95% 的回归（逻辑、契约、平台清单漂移）在 lint-test 就已暴露。
#   分开可让日常提交快速拿到反馈，同时保住「产物正确性」这层不被跳过。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的新推送取消上一轮未跑完的 —— 省钱且避免过期结果覆盖新结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 第一层：ESLint + 单元测试 ──────────────────────────
  lint-test:
    name: Lint & Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22：package-lock 是 lockfileVersion 3，且 urlGuard 的
      # makePinnedLookup 需要 Node 20+ 的 autoSelectFamily 双形态回调
      # （见 src/utils/urlGuard.js）—— 用 Node 18 会在这里假失败。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci 而非 install：lock 与 package.json 不一致时**直接失败**，
      # 这正是我们要的 —— 依赖漂移必须在 CI 拦下，而不是悄悄装出另一套树。
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # 依赖漏洞：走 scripts/audit-gate.cjs —— 它读 audit-allowlist.json 的显式豁免，
      # **剩余的 high/critical 仍然阻断**。直接用 `npm audit --audit-level=high`
      # 会把「不可达且已排除出包的 jade 依赖链」也算成失败，于是发版被永久堵死
      # （这三类豁免的依据见 SECURITY.md「依赖漏洞的显式豁免」）。
      #
      # 但「有漏洞」和「查不到」在 npm audit 里是同一个退出码 1，必须分开：
      # 不少 registry 镜像（含国内常用的 npmmirror）没实现 audit 端点，
      # 会返回 404 NOT_IMPLEMENTED；registry 限流/临时故障同理。
      # 若不区分，一次镜像抖动或限流就能让整个 job 变红，而它与代码质量无关 ——
      # 训练出来的结果是「红了就重跑」，真正的 high 漏洞也就一起被重跑掉了。
      # 所以这里按 stderr 特征把「基础设施失败」降级为 warning 并放行，
      # 「真有漏洞」仍然红灯。
      - name: 依赖漏洞审计（显式豁免清单）
        # 这段是 bash 语法（`set +e` / `[ "$status" -ne 0 ]` / `$?`），必须显式声明
        # shell：job 在 windows-latest 上，默认 shell 是 PowerShell，会被解析成
        # `if (...)` 而直接 ParserError（2026-10-14 CI 红在此，与代码无关）。
        # 同 job 的 Unit tests 步骤已是 PowerShell 写法，两者口径不同是有意保留的。
        shell: bash
        run: |
          set +e
          out=$(npm run audit:deps 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ] && echo "$out" | grep -qiE \
            'audit endpoint returned an error|NOT_IMPLEMENTED|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ETIMEOUT|socket hang up'; then
            echo "::warning::npm audit 端点不可用（registry 未实现 audit 端点或网络故障），本次跳过；漏洞扫描需在官方 registry 下重跑"
            exit 0
          fi
          exit "$status"

      # asar 排除项是否仍安全（死依赖误排除只在打包后爆）
      - name: Dead deps check
        run: npm run check:dead-deps

      # 测试不触网，但大量用例直接碰文件系统与平台分支（符号链接复核 / 目录沙箱 /
      # 路径拼接 / 媒体探测），故 runner 与打包、与用户真实环境保持一致：windows-latest
      # （2026-10-13 改：放在 ubuntu 上时 CI 连续红，而同一份代码在 Windows 上全绿）
      # 归因必须带"差在哪"：只把 `not ok 1181 - 某用例名` 搬进 annotation 等于什么也没说 ——
      # 断言的 error:/expected:/actual: 与 location（文件:行）全在紧随其后的 TAP 详情块里。
      # 而 job 原始日志要仓库 admin 才下得动：非管理员的贡献者对着一条"红了"无从下手
      # （2026-10-14 就红过这样一次：本地 2951 枚全绿、annotation 只有用例名，
      # 最后只能靠猜 Node 版本与 runner 磁盘差异）。连着详情块一起发，
      # 代价是多几条 annotation，换来"哪一条、差在哪、第几行"。
      #
      # 详情窗口取 `not ok` 前 3 行而不是 0 行：node 把「用例结束后才落地的异步活动」报成
      # 整文件级 not ok，真凶地址写在**前面**那行 `# Error: ... generated asynchronous activity
      # after the test ended` 里（实测见 test/ciDoctor.test.js 的 fixture 来源说明）。
      # 只取后文时唯一指出真凶的那一行必然被丢掉 —— 2026-10-14 那轮红就是这么被读成
      # 「某个用例莫名其妙挂了」。
      #
      # 每轮的 TAP 落盘成 attempt-N.tap.txt，红满 3 次后交给 scripts/ci-doctor.cjs 定性：
      # 真回归 / 异步泄漏误归属 / 测试真出网 / 指纹漂移 / 压根不是代码问题 —— 这五种处置
      # 方向相反，让人对着原文自己分辨就是把归因推回给人。归因是纯确定性规则、只读自己的
      # 落盘产物（CI 不出网、不花钱），且退出码恒为 0：红不红仍由本步骤判，它只解释红。
      # 说明写在 YAML 注释而不是 run 块里：run 块每一行都会原样进 PowerShell 脚本文件，
      # 那里的注释还得对 runner 的脚本编码负责 —— 能不冒这个险就不冒
      # （本文件上面审计步骤的 `shell: bash` 注记记的是同一族的坑：解析器选错，红得与代码无关）。
      # 落盘前先强令控制台码页为 UTF-8：PowerShell 捕获原生命令的 stdout 是按
      # [Console]::OutputEncoding 解码的，而 Windows runner 的默认码页不是 UTF-8。
      # 不设为 UTF-8 的后果不是报错，是**静默损坏** —— node 吐的 UTF-8 中文按码页解成乱码再落盘，
      # 而 FAIL-DETAIL 直接从内存回显到控制台时又按同一码页编回去，看起来一切正常，
      # 只有落盘的 attempt-N.tap.txt 里用例名已经烂掉（2026-10-14 本地实测到这一层才看清）。
      # 归因本身不依赖中文（判据全是 ASCII，见 test/ciDoctor.test.js 的乱码用例），
      # 但「哪个用例红的」这句话丢了，就等于把归因做成了半件。
      - name: Unit tests
        # 与 release.yml 同口径：并发 2 + 重试 3 次 + 失败用例以 annotation 暴露。
        # 判据与理由见 release.yml 同名步骤的注释；两处命令体必须逐行相同，
        # 这件事由 test/ciDoctor.test.js 的形状钉守着（分叉过一次：probe 调试行只在一侧被删）。
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          for ($i = 1; $i -le 3; $i++) {
            $out = node --test --test-concurrency=2 "test/*.test.js" 2>&1
            $code = $LASTEXITCODE
            $out | Out-File -FilePath "attempt-$i.tap.txt" -Encoding utf8
            Set-Content -Path "attempt-$i.exit" -Value $code -Encoding ascii
            if ($code -eq 0) { Write-Output "passed on attempt $i"; exit 0 }
            $hits = @($out | Select-String -Pattern 'not ok \d+' -Context 3,26 | Select-Object -First 4)
            Write-Output "::error::matched $($hits.Count) failing tests"
            foreach ($h in $hits) {
              $body = (@($h.Context.PreContext) + @($h.Line) + @($h.Context.PostContext)) -join ' | '
              $body = ($body -replace '%', '%25' -replace '#', '%23') -replace "`r", ''
              $body = $body -replace "`n", ' ' -replace ' +', ' '
              if ($body.Length -gt 1400) { $body = $body.Substring(0, 1400) }
              Write-Output "::error::FAIL-DETAIL $body"
            }
            Start-Sleep -Seconds 10
          }
          node scripts/ci-doctor.cjs --tap-dir . --summary
          Write-Output "::error::Unit tests failed 3 attempts in a row"
          exit 1

      # 归因引擎的 FAIL 分支自检（合成红 TAP，每次绿跑都走一遍）。
      # 为什么要有这一步：上面那行 `--tap-dir . --summary` 只在单测连红三次之后才执行，
      # 于是「归因引擎自己坏了」这件事只会在真正需要它的那次红里暴露 —— 而那次恰好缺归因
      # （与 test/ciDoctor.test.js 把归因引擎单独拉进 lint 覆盖是同一条理由：把死角提前到日常提交）。
      # 做法是喂一份**合成的**红 TAP（test/fixtures/ci-doctor-red.tap：三轮同指纹 + 中文用例名），
      # 让红路和绿路一样每天真跑一次，而不是靠人造一次真红。
      #
      # 两条不变量，改这一步之前先读懂：
      #   ① 归因输出必须**捕获**、不许裸回显。红路 annotation 的真身是 `::error::` 开头的行，
      #      裸跑就等于在绿跑上伪造一堆真红 annotation —— Unit tests 里那条调试探针行干过的事
      #      （每次绿跑发一条假 error）。自检失败时确实要回显排查原文，但先把前缀换成中性串：
      #      连「自检挂了」这一次都不该顺带伪造一层红。
      #   ② GITHUB_STEP_SUMMARY 必须在步骤内改指临时文件。归因表写得挺像样（结论：FAIL +
      #      用例名 + 处置建议），不改指向就是把假红写进真实 job summary，绿跑看着像红过 ——
      #      那比没有自检更糟。
      # 断言里不许出现中文字面量：这个 run 块会被原样写进 PowerShell 脚本文件，编码由 runner 决定
      # （本文件上面 Unit tests 那段注记的同一口径）。所以「中文用例名活着」不写成中文去比，改成
      # 两条定位到**用例名那一位**的正向断言：annotation 的 `name=` 后面必须还有非 ASCII 字符、
      # summary 表格里 `| DETERMINISTIC_REGRESSION | ` 后面同理；再加一条 U+FFFD 不许出现
      # （U+FFFD 用 [char]0xFFFD 拼）。为什么定位到那一位：全串级别的「还有非 ASCII 吗」探测不到
      # 用例名烂掉 —— 归因的建议文案本身就是中文，2026-10-14 拿纯 ASCII 用例名的 fixture 试过一次，
      # 全串探测照样放行。
      # 覆盖范围如实说清：这一步验的是「脚本在 runner 的 Node/PowerShell/真实文件路径下跑得通、
      # 定得对性、中文不烂」；它读的是合成 TAP，不验真红时上游落盘的那三份文件本身是否完好。
      - name: CI doctor self-check
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $work = Join-Path $env:RUNNER_TEMP ("ci-doctor-selfcheck-" + $env:GITHUB_RUN_ID)
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          for ($i = 1; $i -le 3; $i++) {
            Copy-Item test/fixtures/ci-doctor-red.tap (Join-Path $work ("attempt-$i.tap.txt"))
            Set-Content -Path (Join-Path $work ("attempt-$i.exit")) -Value 1 -Encoding ascii
          }
          $env:GITHUB_STEP_SUMMARY = Join-Path $work 'step-summary.md'
          $out = node scripts/ci-doctor.cjs --tap-dir $work --summary 2>&1
          $code = $LASTEXITCODE
          $text = ($out | Out-String)
          $fffd = [string][char]0xFFFD
          $bad = @()
          if ($code -ne 0) { $bad += "exit=$code" }
          if ($text -notmatch 'CI-DOCTOR category=DETERMINISTIC_REGRESSION') { $bad += 'no annotation' }
          if ($text -match $fffd) { $bad += 'annotation mojibake' }
          if ($text -notmatch 'name=[^\u0000-\u007f]') { $bad += 'test name lost' }
          $sum = ''
          if (Test-Path $env:GITHUB_STEP_SUMMARY) { $sum = Get-Content -Raw -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          if ($sum -notmatch '## CI') { $bad += 'no step summary' }
          if ($sum -match $fffd) { $bad += 'summary mojibake' }
          if ($sum -notmatch '\| DETERMINISTIC_REGRESSION \| [^\u0000-\u007f]') { $bad += 'summary test name lost' }
          if ($bad.Count -gt 0) {
            ($text -replace '::error::', 'DOC-ERR ') | Write-Output
            Write-Output ('CI-DOCTOR-SELFCHECK-FAILED ' + ($bad -join '; '))
            exit 1
          }
          Write-Output 'CI-DOCTOR-SELFCHECK-OK'

  # ── 第二层：构建 + asar 冒烟 ───────────────────────────
  build-smoke:
    name: Build & Asar Smoke
    runs-on: windows-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite build + scripts/postbuild.js（拷贝 api/utils/shared/main-ipc
      # 与独立窗口的 base.css —— 漏拷只在打包后复现）
      - name: Build
        run: npm run build

      # 只打 --dir（解开目录），不打 nsis 安装包：
      #   - smoke test 校验的是 app.asar 内容，--dir 产物里已有
      #   - nsis 步骤要跑 makensis、签名、生成卸载器，几分钟且对 CI 无增量价值
      #   - 本地实测 nsis 收尾阶段会触发文件清理问题导致退出非 0，
      #     会把「内容正确」误报成构建失败
      - name: Package (win, dir only)
        run: npx electron-builder --config build/config.cjs --win --x64 --dir --publish never
        env:
          # 跳过 electron-builder 的代码签名探测（CI 无证书，不跳会报错）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Asar smoke test
        run: npm run smoke:asar

      # 产物留存：CI 挂了可以直接下载现场排查，不必本地重打一遍
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-asar-${{ github.sha }}
          path: release/win-unpacked/resources/app.asar
          if-no-files-found: warn
          retention-days: 7
